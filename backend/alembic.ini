# Configuração do Alembic — Estoque Farmácia.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# A URL real vem de app/core/config.py (variável de ambiente DATABASE_URL),
# lida em alembic/env.py — o valor abaixo é só um placeholder.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
