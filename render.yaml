# Blueprint do Render — fase protótipo (sem custo, plano free).
#
# Quando o sistema for pra uso real no hospital, a arquitetura definitiva
# é servidor local (ver docs/03_DEPLOY.md) — isto aqui é só para testar
# remotamente enquanto ainda é protótipo.
#
# DATABASE_URL fica em branco de propósito (sync: false) — o Render pede
# esse valor na hora de aplicar o blueprint. Cole ali a connection string
# do Neon (formato: postgresql://usuario:senha@ep-xxxx.neon.tech/dbname).
#
# JWT_SECRET_KEY é gerado automaticamente pelo Render (generateValue) —
# ninguém precisa inventar nem guardar esse valor manualmente.
#
# HOSPITAL_NOME/HOSPITAL_ORGANIZACAO também ficam em branco de propósito
# (sync: false) — repositório é público, o nome real da instituição não
# fica hardcoded aqui; preencher direto no painel do Render.
services:
  - type: web
    name: estoquefarmacia-6b49d5
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: HOSPITAL_NOME
        sync: false
      - key: HOSPITAL_ORGANIZACAO
        sync: false
      - key: RELATORIO_VENCIMENTO_DIAS
        value: "30"
      - key: CORS_ORIGINS
        value: "*"
